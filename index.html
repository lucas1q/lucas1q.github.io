<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程时间查询 - 自动OCR版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
        <header class="mb-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">课程时间查询</h1>
            <p class="text-gray-600">Roboflow OCR识别 · 多人共享</p>
            <div id="connectionStatus" class="mt-2 text-sm py-1 px-3 rounded-full inline-block bg-yellow-100 text-yellow-800">
                <i class="fa fa-circle-o-notch fa-spin mr-1"></i> 连接中...
            </div>
        </header>
        
        <!-- Roboflow OCR文件导入区域 -->
        <div class="bg-blue-50 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                <i class="fa fa-file-text-o mr-2 text-purple-500"></i> 自动OCR识别导入
            </h2>
            
            <div class="border-2 border-dashed border-blue-200 rounded-lg p-8 text-center">
                <i class="fa fa-picture-o text-5xl text-blue-300 mb-4"></i>
                <p class="text-gray-600 mb-4">上传课程表图片，系统将自动提取课程信息</p>
                
                <div class="flex flex-col md:flex-row gap-4 justify-center">
                    <label for="fileUpload" class="bg-blue-500 hover:bg-blue-600 text-white py-3 px-6 rounded-md transition-colors flex items-center justify-center cursor-pointer">
                        <i class="fa fa-upload mr-2"></i> 选择图片
                        <input type="file" id="fileUpload" accept=".jpg,.jpeg,.png" class="hidden">
                    </label>
                    
                    <button id="startRecognition" class="bg-purple-500 hover:bg-purple-600 text-white py-3 px-6 rounded-md transition-colors flex items-center justify-center" disabled>
                        <i class="fa fa-cog mr-2"></i> 开始识别
                    </button>
                </div>
                
                <p class="text-xs text-gray-500 mt-4">支持格式：JPG、PNG（建议图片清晰，文字水平）</p>
            </div>
            
            <!-- 识别进度 -->
            <div id="recognitionProgress" class="mt-6 hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm text-gray-600">识别中...</span>
                    <span id="progressPercent" class="text-sm text-gray-600">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2.5">
                    <div id="progressBar" class="bg-purple-500 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
            </div>
            
            <!-- OCR识别结果 -->
            <div id="ocrResult" class="mt-6 hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-3">识别的文本内容（可编辑）</h3>
                <textarea id="recognizedText" class="w-full border border-gray-300 rounded-md p-3 h-32 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="识别的文本将显示在这里..."></textarea>
                
                <button id="parseText" class="mt-4 bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-md transition-colors flex items-center">
                    <i class="fa fa-magic mr-2"></i> 解析课程信息
                </button>
            </div>
            
            <!-- 解析结果预览 -->
            <div id="parsedCoursesContainer" class="mt-6 hidden">
                <h3 class="text-lg font-medium text-gray-700 mb-3">解析的课程信息（可编辑）</h3>
                <div id="parsedCourses" class="space-y-4 p-4 bg-white rounded-lg border border-gray-200 max-h-60 overflow-y-auto">
                    <!-- 解析出的课程会在这里显示 -->
                </div>
                <div class="mt-4 flex justify-end">
                    <button id="saveParsedCourses" class="bg-green-500 hover:bg-green-600 text-white py-2 px-6 rounded-md transition-colors flex items-center">
                        <i class="fa fa-save mr-2"></i> 保存所有课程
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 主内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左侧：时间选择器 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-md p-5">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                        <i class="fa fa-calendar mr-2 text-blue-500"></i> 时间选择
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="selectedDate" class="block text-gray-700 mb-1">选择日期</label>
                            <input type="date" id="selectedDate" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div>
                            <label for="selectedTime" class="block text-gray-700 mb-1">选择时间</label>
                            <input type="time" id="selectedTime" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <button id="useCurrentTime" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-md transition-colors flex items-center justify-center">
                            <i class="fa fa-clock-o mr-2"></i> 使用当前时间
                        </button>
                    </div>
                    
                    <div class="mt-6 pt-4 border-t border-gray-100">
                        <h3 class="text-lg font-medium text-gray-700 mb-3">今日课程概览</h3>
                        <div id="todayOverview" class="space-y-2 max-h-60 overflow-y-auto">
                            <p class="text-gray-500 italic text-sm">选择日期后显示</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧：课程信息和导入 -->
            <div class="lg:col-span-2">
                <!-- 当前时间上课情况 -->
                <div class="bg-white rounded-lg shadow-md p-5 mb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                        <i class="fa fa-users mr-2 text-purple-500"></i> 
                        <span id="currentViewTitle">当前时间上课情况</span>
                    </h2>
                    
                    <div id="currentClassContainer" class="p-6 border-2 border-dashed border-gray-200 rounded-lg text-center">
                        <i class="fa fa-calendar-check-o text-5xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500" id="currentClassInfo">请选择时间查看上课情况</p>
                    </div>
                </div>
                
                <!-- 手动添加课程信息 -->
                <div class="bg-white rounded-lg shadow-md p-5">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                        <i class="fa fa-plus-circle mr-2 text-green-500"></i> 手动添加课程
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label for="studentName" class="block text-gray-700 mb-1">学生姓名</label>
                            <input type="text" id="studentName" placeholder="输入学生姓名" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label for="classDay" class="block text-gray-700 mb-1">星期</label>
                                <select id="classDay" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="1">周一</option>
                                    <option value="2">周二</option>
                                    <option value="3">周三</option>
                                    <option value="4">周四</option>
                                    <option value="5">周五</option>
                                    <option value="6">周六</option>
                                    <option value="0">周日</option>
                                </select>
                            </div>
                            
                            <div>
                                <label for="classStartTime" class="block text-gray-700 mb-1">开始时间</label>
                                <input type="time" id="classStartTime" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            
                            <div>
                                <label for="classEndTime" class="block text-gray-700 mb-1">结束时间</label>
                                <input type="time" id="classEndTime" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                        </div>
                        
                        <button id="addClass" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-md transition-colors flex items-center">
                            <i class="fa fa-save mr-2"></i> 添加课程
                        </button>
                    </div>
                    
                    <!-- 已添加的课程 -->
                    <div class="mt-8">
                        <h3 class="text-lg font-medium text-gray-700 mb-3">已添加的课程</h3>
                        <div id="classList" class="space-y-2 max-h-60 overflow-y-auto">
                            <p class="text-gray-500 italic text-sm">加载中...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="mt-10 text-center text-gray-500 text-sm pb-6">
            <p>基于SheetDB和Roboflow OCR构建 · 免费识别课程信息</p>
        </footer>
    </div>

    <script>
        // 填入你的SheetDB API地址
        const SHEETDB_API_URL = 'https://sheetdb.io/api/v1/bxiin2slk7riv';
        // 内置Roboflow API密钥
        const ROBOFLOW_API_KEY = 'O8UFqh0WwmON6pvbKPMs';
        
        // DOM元素
        const fileUpload = document.getElementById('fileUpload');
        const startRecognition = document.getElementById('startRecognition');
        const recognitionProgress = document.getElementById('recognitionProgress');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const ocrResult = document.getElementById('ocrResult');
        const recognizedText = document.getElementById('recognizedText');
        const parseText = document.getElementById('parseText');
        const parsedCoursesContainer = document.getElementById('parsedCoursesContainer');
        const parsedCourses = document.getElementById('parsedCourses');
        const saveParsedCourses = document.getElementById('saveParsedCourses');
        const selectedDate = document.getElementById('selectedDate');
        const selectedTime = document.getElementById('selectedTime');
        const useCurrentTime = document.getElementById('useCurrentTime');
        const currentViewTitle = document.getElementById('currentViewTitle');
        const currentClassContainer = document.getElementById('currentClassContainer');
        const todayOverview = document.getElementById('todayOverview');
        const studentName = document.getElementById('studentName');
        const classDay = document.getElementById('classDay');
        const classStartTime = document.getElementById('classStartTime');
        const classEndTime = document.getElementById('classEndTime');
        const addClassBtn = document.getElementById('addClass');
        const classList = document.getElementById('classList');
        const connectionStatus = document.getElementById('connectionStatus');
        
        // 初始化日期和时间为当前时间
        const now = new Date();
        selectedDate.value = now.toISOString().split('T')[0];
        selectedTime.value = now.toTimeString().split(' ')[0].slice(0, 5);
        updateViewTitle();
        
        // 文件上传事件
        fileUpload.addEventListener('change', (e) => {
            startRecognition.disabled = e.target.files.length === 0;
            if (e.target.files.length > 0) {
                alert(`已选择文件: ${e.target.files[0].name}`);
            }
        });
        
        // 开始识别按钮事件
        startRecognition.addEventListener('click', () => {
            if (!fileUpload.files.length) return;
            
            const file = fileUpload.files[0];
            // 简单验证文件大小（限制5MB以内）
            if (file.size > 5 * 1024 * 1024) {
                alert('文件过大，请选择5MB以内的图片');
                return;
            }
            
            // 显示进度条
            recognitionProgress.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            
            // 调用Roboflow OCR API
            callRoboflowOcrApi(file);
        });
        
        // 解析文本按钮事件
        parseText.addEventListener('click', () => {
            if (!recognizedText.value.trim()) {
                alert('没有可解析的文本内容');
                return;
            }
            
            // 解析识别到的文本，提取课程信息
            const courses = parseCourseText(recognizedText.value);
            displayParsedCourses(courses);
            parsedCoursesContainer.classList.remove('hidden');
        });
        
        // 保存识别结果按钮事件
        saveParsedCourses.addEventListener('click', async () => {
            const courseElements = parsedCourses.querySelectorAll('.course-item');
            const coursesToSave = [];
            
            courseElements.forEach(el => {
                const student = el.querySelector('.student-name').value.trim();
                const day = el.querySelector('.course-day').value;
                const start = el.querySelector('.course-start').value;
                const end = el.querySelector('.course-end').value;
                
                if (student && day && start && end && start < end) {
                    coursesToSave.push({
                        student_name: student,
                        day: day,
                        start_time: start,
                        end_time: end
                    });
                }
            });
            
            if (coursesToSave.length === 0) {
                alert('请确认课程信息是否完整');
                return;
            }
            
            try {
                // 批量保存课程
                for (const course of coursesToSave) {
                    await fetch(SHEETDB_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ data: course })
                    });
                }
                
                // 刷新课程列表
                fetchClasses();
                checkCurrentClasses();
                updateTodayOverview();
                
                // 重置识别区域
                parsedCoursesContainer.classList.add('hidden');
                ocrResult.classList.add('hidden');
                fileUpload.value = '';
                startRecognition.disabled = true;
                
                alert(`成功保存 ${coursesToSave.length} 条课程信息`);
            } catch (error) {
                console.error('保存课程失败:', error);
                alert('保存课程失败，请重试');
            }
        });
        
        // 其他事件监听
        useCurrentTime.addEventListener('click', () => {
            const now = new Date();
            selectedDate.value = now.toISOString().split('T')[0];
            selectedTime.value = now.toTimeString().split(' ')[0].slice(0, 5);
            updateViewTitle();
            checkCurrentClasses();
            updateTodayOverview();
        });
        
        selectedDate.addEventListener('change', () => {
            updateViewTitle();
            checkCurrentClasses();
            updateTodayOverview();
        });
        
        selectedTime.addEventListener('change', () => {
            updateViewTitle();
            checkCurrentClasses();
        });
        
        addClassBtn.addEventListener('click', addNewClass);
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            checkSheetDBConnection();
            
            // 定时刷新数据（每30秒）
            setInterval(() => {
                fetchClasses();
                checkCurrentClasses();
                updateTodayOverview();
            }, 30000);
        });
        
        // 调用Roboflow OCR API
        async function callRoboflowOcrApi(file) {
            try {
                // 1. 将图片转为Base64
                const base64Image = await fileToBase64(file);
                
                // 2. 显示进度
                updateProgress(30);
                
                // 3. 调用Roboflow OCR API（使用内置密钥）
                const response = await fetch('https://infer.roboflow.com/doctr/ocr', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${ROBOFLOW_API_KEY}`
                    },
                    body: JSON.stringify({
                        // 只发送Base64数据部分（去掉data:image/...前缀）
                        image: base64Image.split(',')[1]
                    })
                });
                
                updateProgress(70);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `API请求失败: ${response.status}`);
                }
                
                const result = await response.json();
                
                // 4. 提取识别到的文本
                let fullText = '';
                if (result && result.pages && result.pages.length > 0) {
                    result.pages[0].blocks.forEach(block => {
                        block.lines.forEach(line => {
                            line.words.forEach(word => {
                                fullText += word.text +'';
                            });
                            fullText += '\n';
                        });
                    });
                }
                
                updateProgress(100);
                
                // 5. 显示识别结果
                recognizedText.value = fullText;
                ocrResult.classList.remove('hidden');
                
            } catch (error) {
                console.error('Roboflow OCR API调用失败:', error);
                alert(`识别失败: ${error.message}`);
                updateProgress(0);
            }
        }
        
        // 将文件转为Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsDataURL(file);
            });
        }
        
        // 更新进度条
        function updateProgress(percent) {
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${percent}%`;
            
            if (percent === 100) {
                setTimeout(() => {
                    recognitionProgress.classList.add('hidden');
                }, 1000);
            }
        }
        
        // 解析文本中的课程信息
        function parseCourseText(text) {
            // 支持的星期关键词映射
            const dayKeywords = {
                '日': '0',
                '天': '0',
                '一': '1',
                '二': '2',
                '三': '3',
                '四': '4',
                '五': '5',
                '六': '6',
                '周日': '0',
                '周一': '1',
                '周二': '2',
                '周三': '3',
                '周四': '4',
                '周五': '5',
                '周六': '6'
            };
            
            // 分割文本为行
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            const courses = [];
            
            // 简单的课程信息提取规则
            lines.forEach(line => {
                // 匹配包含时间格式(HH:MM或HH-MM)和星期的行
                const timeRegex = /(\d{1,2}:\d{2})[^\d]*(\d{1,2}:\d{2})/;
                const dayRegex = /(周[日一二三四五六天]|周日|周一|周二|周三|周四|周五|周六)/;
                
                const timeMatch = line.match(timeRegex);
                const dayMatch = line.match(dayRegex);
                
                if (timeMatch && dayMatch) {
                    // 提取开始和结束时间
                    const [_, startTime, endTime] = timeMatch;
                    
                    // 提取星期
                    const dayText = dayMatch[0];
                    const day = dayKeywords[dayText] || '1'; // 默认周一
                    
                    // 提取学生姓名(去掉时间和星期后的剩余文本)
                    let studentName = line.replace(timeRegex, '').replace(dayRegex, '').trim();
                    // 清理可能的特殊字符
                    studentName = studentName.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g,'').trim();
                    
                    if (studentName) {
                        courses.push({
                            student: studentName,
                            day: day,
                            start: startTime,
                            end: endTime
                        });
                    }
                }
            });
            
            // 如果没有解析到课程，返回一个空模板
            if (courses.length === 0) {
                return [{
                    student: '',
                    day: '1',
                    start: '09:00',
                    end: '10:30'
                }];
            }
            
            return courses;
        }
        
        // 显示解析出的课程
        function displayParsedCourses(results) {
            parsedCourses.innerHTML = '';
            const dayMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            
            results.forEach((course, index) => {
                const courseEl = document.createElement('div');
                courseEl.className = 'course-item p-3 border border-gray-200 rounded-md';
                courseEl.innerHTML = `
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="flex-1">
                            <label class="block text-sm text-gray-600 mb-1">学生姓名</label>
                            <input type="text" class="student-name w-full border border-gray-300 rounded px-2 py-1" value="${course.student}">
                        </div>
                        
                        <div class="w-24">
                            <label class="block text-sm text-gray-600 mb-1">星期</label>
                            <select class="course-day w-full border border-gray-300 rounded px-2 py-1">
                                ${[0,1,2,3,4,5,6].map(day => `
                                    <option value="${day}" ${course.day == day? 'selected' : ''}>${dayMap[day]}</option>
                                `).join('')}
                            </select>
                        </div>
                        
                        <div class="w-24">
                            <label class="block text-sm text-gray-600 mb-1">开始时间</label>
                            <input type="time" class="course-start w-full border border-gray-300 rounded px-2 py-1" value="${course.start}">
                        </div>
                        
                        <div class="w-24">
                            <label class="block text-sm text-gray-600 mb-1">结束时间</label>
                            <input type="time" class="course-end w-full border border-gray-300 rounded px-2 py-1" value="${course.end}">
                        </div>
                        
                        <div class="flex items-end">
                            <button class="remove-course text-red-500 hover:text-red-700 p-2" data-index="${index}">
                                <i class="fa fa-trash-o"></i>
                            </button>
                        </div>
                    </div>
                `;
                parsedCourses.appendChild(courseEl);
            });
            
            // 添加删除单条课程的事件
            document.querySelectorAll('.remove-course').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = e.currentTarget.getAttribute('data-index');
                    parsedCourses.children[index].remove();
                });
            });
        }
        
        // 以下是原有功能代码（与SheetDB交互部分）
        async function checkSheetDBConnection() {
            try {
                const response = await fetch(SHEETDB_API_URL);
                if (response.ok) {
                    connectionStatus.innerHTML = '<i class="fa fa-check mr-1"></i> 已连接';
                    connectionStatus.className = 'mt-2 text-sm py-1 px-3 rounded-full inline-block bg-green-100 text-green-800';
                    fetchClasses();
                    checkCurrentClasses();
                    updateTodayOverview();
                } else {
                    throw new Error('连接失败');
                }
            } catch (error) {
                connectionStatus.innerHTML = '<i class="fa fa-exclamation-triangle mr-1"></i> 连接失败';
                connectionStatus.className = 'mt-2 text-sm py-1 px-3 rounded-full inline-block bg-red-100 text-red-800';
                console.error('SheetDB连接失败:', error);
            }
        }
        
        async function fetchClasses() {
            try {
                const response = await fetch(SHEETDB_API_URL);
                const classes = await response.json();
                
                if (Array.isArray(classes) && classes.length > 0) {
                    displayClassList(classes);
                } else {
                    classList.innerHTML = '<p class="text-gray-500 italic text-sm">暂无课程数据</p>';
                }
            } catch (error) {
                console.error('加载课程失败:', error);
                classList.innerHTML = '<p class="text-red-500 italic text-sm">加载课程失败</p>';
            }
        }
        
        function updateViewTitle() {
            const date = new Date(selectedDate.value);
            const dateStr = date.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
            currentViewTitle.textContent = `${dateStr} ${selectedTime.value} 上课情况`;
        }
        
        async function checkCurrentClasses() {
            try {
                const targetDate = new Date(selectedDate.value);
                const targetDay = targetDate.getDay();
                const targetTime = selectedTime.value;
                
                const response = await fetch(SHEETDB_API_URL);
                const classes = await response.json();
                
                if (Array.isArray(classes) && classes.length > 0) {
                    const currentClasses = classes.filter(classItem => {
                        return parseInt(classItem.day) === targetDay && 
                               isTimeBetween(targetTime, classItem.start_time, classItem.end_time);
                    });
                    
                    if (currentClasses.length > 0) {
                        let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
                        currentClasses.forEach(classItem => {
                            html += `
                                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                                    <div class="font-medium text-gray-800">${classItem.student_name}</div>
                                    <div class="text-xs text-gray-500 mt-2">时间: ${classItem.start_time} - ${classItem.end_time}</div>
                                </div>
                            `;
                        });
                        html += '</div>';
                        currentClassContainer.innerHTML = html;
                    } else {
                        currentClassContainer.innerHTML = `
                            <i class="fa fa-check-circle text-5xl text-green-300 mb-3"></i>
                            <p class="text-gray-500">该时间没有人上课</p>
                        `;
                    }
                } else {
                    currentClassContainer.innerHTML = `
                        <i class="fa fa-info-circle text-5xl text-blue-300 mb-3"></i>
                        <p class="text-gray-500">暂无课程数据</p>
                    `;
                }
            } catch (error) {
                console.error('查询课程失败:', error);
                currentClassContainer.innerHTML = '<p class="text-red-500">查询失败，请重试</p>';
            }
        }
        
        async function updateTodayOverview() {
            try {
                const targetDate = new Date(selectedDate.value);
                const targetDay = targetDate.getDay();
                
                const response = await fetch(SHEETDB_API_URL);
                const classes = await response.json();
                
                if (Array.isArray(classes) && classes.length > 0) {
                    const dayClasses = classes.filter(classItem => parseInt(classItem.day) === targetDay);
                    dayClasses.sort((a, b) => a.start_time.localeCompare(b.start_time));
                    
                    if (dayClasses.length > 0) {
                        let html = '';
                        dayClasses.forEach(classItem => {
                            html += `
                                <div class="flex items-center p-2 border-b border-gray-100 last:border-0">
                                    <div class="w-24 text-sm text-gray-600">${classItem.start_time}</div>
                                    <div class="flex-1 text-sm font-medium">${classItem.student_name}</div>
                                </div>
                            `;
                        });
                        todayOverview.innerHTML = html;
                    } else {
                        todayOverview.innerHTML = '<p class="text-gray-500 italic text-sm">当天没有课程安排</p>';
                    }
                } else {
                    todayOverview.innerHTML = '<p class="text-gray-500 italic text-sm">暂无课程数据</p>';
                }
            } catch (error) {
                console.error('加载课程概览失败:', error);
                todayOverview.innerHTML = '<p class="text-red-500 italic text-sm">加载失败</p>';
            }
        }
        
        function displayClassList(classes) {
            const dayMap = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            let html = '';
            
            const sortedClasses = [...classes].sort((a, b) => {
                if (parseInt(a.day)!== parseInt(b.day)) {
                    return parseInt(a.day) - parseInt(b.day);
                }
                return a.start_time.localeCompare(b.start_time);
            });
            
            sortedClasses.forEach(classItem => {
                html += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-md border border-gray-100">
                        <div class="flex-1">
                            <div class="font-medium">${classItem.student_name}</div>
                            <div class="text-sm text-gray-600">
                                ${dayMap[parseInt(classItem.day)]} ${classItem.start_time} - ${classItem.end_time}
                            </div>
                        </div>
                    </div>
                `;
            });
            
            classList.innerHTML = html;
        }
        
        async function addNewClass() {
            if (!studentName.value.trim()) {
                alert('请输入学生姓名');
                return;
            }
            
            if (!classStartTime.value ||!classEndTime.value) {
                alert('请选择课程开始和结束时间');
                return;
            }
            
            if (classStartTime.value >= classEndTime.value) {
                alert('结束时间必须晚于开始时间');
                return;
            }
            
            const newClass = {
                student_name: studentName.value.trim(),
                day: classDay.value,
                start_time: classStartTime.value,
                end_time: classEndTime.value
            };
            
            try {
                const response = await fetch(SHEETDB_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: newClass })
                });
                
                const result = await response.json();
                
                if (response.ok && result.created === 1) {
                    studentName.value = '';
                    fetchClasses();
                    checkCurrentClasses();
                    updateTodayOverview();
                    alert('课程添加成功');
                } else {
                    throw new Error(result.message || '添加失败');
                }
            } catch (error) {
                console.error('添加课程失败:', error);
                alert(`添加课程失败: ${error.message}`);
            }
        }
        
        function isTimeBetween(time, startTime, endTime) {
            return time >= startTime && time <= endTime;
        }
    </script>
</body>
